<!-- The card is a DIV, not an A, and the link comes from the page definition's
     fragmentLink. An element carrying data-lfr-editable-type="link" has its
     whole content replaced by the editable's text, so an <a> wrapper would
     delete the image and the caption and leave a bare text link. -->
<div class="of-cat">
	<span class="of-cat-media" data-lfr-background-image-id="backgroundImage"></span>

	<span class="of-cat-body">
		<span class="of-cat-title" data-lfr-editable-id="title" data-lfr-editable-type="text">
			Shelter
		</span>

		<span class="of-cat-meta" data-lfr-editable-id="meta" data-lfr-editable-type="text">
			Tents, tarps, bivvies
		</span>
	</span>
</div>
