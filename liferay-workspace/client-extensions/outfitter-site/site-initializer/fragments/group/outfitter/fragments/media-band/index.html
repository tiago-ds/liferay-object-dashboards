<section class="of-band of-band-${(configuration.height)!"short"}" data-lfr-background-image-id="backgroundImage">
	<div class="of-band-scrim of-band-scrim-${(configuration.scrim)!"medium"}"></div>

	<div class="container of-band-inner of-align-${(configuration.align)!"left"}">
		<h2 class="of-band-title" data-lfr-editable-id="title" data-lfr-editable-type="text">
			A line worth stopping for
		</h2>

		<p class="of-band-lead" data-lfr-editable-id="lead" data-lfr-editable-type="text">
			Supporting sentence.
		</p>

		[#if (configuration.showCta)!true]
			<a class="btn btn-primary btn-lg of-band-cta" data-lfr-editable-id="cta" data-lfr-editable-type="link" href="/web/outfitter/catalogue">
				Browse the gear
			</a>
		[/#if]
	</div>
</section>
